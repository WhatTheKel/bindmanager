[agent]
# Base URL of BindManager's REST API (no trailing slash needed)
api_url = https://bindmanager.example.com/api/v1

# From Manage > Nameservers in the BindManager UI (or Django admin) for the
# NameServer row that represents *this* physical server. Keep this file
# root-readable only (chmod 600) — it's a bearer credential scoped to every
# zone assigned to this nameserver.
api_key = REPLACE_ME

# Where generated .zone files are written — must match what your
# named.conf zone stanzas (or the generated include below) point at.
zones_dir = /etc/bind/zones

# Optional: if set, the agent writes a BIND config fragment declaring every
# zone assigned to this server, kept in sync automatically as zones are
# added/removed centrally. Add `include "<this path>";` to named.conf once,
# by hand, and never edit the generated file directly.
named_conf_include = /etc/bind/named.bindmanager.conf

# Bare names below are resolved via $PATH — override only if your init
# system runs the agent with a restricted PATH, or these binaries live
# somewhere nonstandard. Don't assume /usr/sbin: e.g. Debian bookworm ships
# named-checkzone/-checkconf under /usr/bin instead.
rndc_bin = rndc
checkzone_bin = named-checkzone
checkconf_bin = named-checkconf

lock_file = /var/lock/bindmanager_agent.lock
manifest_file = /var/lib/bindmanager-agent/managed_zones.json
timeout = 15
