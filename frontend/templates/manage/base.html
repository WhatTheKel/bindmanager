{% extends "base.html" %}
{% block nav_manage %}active{% endblock %}

{% block content %}
<div class="manage-wrap">

  <!-- Sidebar -->
  <aside class="manage-sidebar">
    <div class="sidebar-label">DNS</div>

    <a href="{% url 'dns_manager:manage_zone_list' %}"
       class="sidebar-link {% block sb_zones %}{% endblock %}">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      Zones
    </a>

    <a href="{% url 'dns_manager:manage_nameserver_list' %}"
       class="sidebar-link {% block sb_nameservers %}{% endblock %}">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="8" rx="2"/>
        <rect x="2" y="14" width="20" height="8" rx="2"/>
        <line x1="6" y1="6" x2="6.01" y2="6"/>
        <line x1="6" y1="18" x2="6.01" y2="18"/>
      </svg>
      Nameservers
    </a>

    <div class="sidebar-divider"></div>
    <div class="sidebar-label">System</div>

    <a href="{% url 'dns_manager:manage_audit_log' %}"
       class="sidebar-link {% block sb_audit %}{% endblock %}">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      Audit Log
    </a>

    {% if user.is_superuser %}
    <a href="{% url 'dns_manager:manage_user_list' %}"
       class="sidebar-link {% block sb_users %}{% endblock %}">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Users
    </a>
    {% endif %}
  </aside>

  <!-- Main content -->
  <div class="manage-body">
    {% block breadcrumbs %}{% endblock %}
    {% block manage_content %}{% endblock %}
  </div>

</div>
{% endblock %}
