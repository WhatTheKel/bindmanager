services:

  # Hidden primary — answers no DNS queries. Exists only so the worker's
  # `rndc reload <zone>` (writer.py, called unconditionally from
  # tasks.sync_zone) has a real named to talk to. The 3 actually-answering
  # nameservers run agents/bindmanager_agent.py instead — see INSTALL.md.
  bind:
    build: ./docker/bind9
    restart: unless-stopped
    volumes:
      - ./bind_zones:/etc/bind/zones:ro
      - ./bind_dynamic:/etc/bind/zones-dynamic
      - ./bind_rndc:/etc/bind/rndc-shared
    healthcheck:
      test: ["CMD-SHELL", "rndc status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./bind_zones:/etc/bind/zones   # zone files written here
      - ./staticfiles:/app/staticfiles
      - ./branding:/app/branding:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./bind_zones:/etc/bind/zones
      - ./bind_rndc:/etc/bind/rndc-shared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bind:
        condition: service_healthy
    command: celery -A config worker -l info -Q zone_sync -c 2

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "81:81"
      - "444:444"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./branding:/app/branding:ro
    depends_on:
      - web

  # DNS-01 issuance for zones BindManager manages. Not started by `up` — it's
  # a one-shot job, run explicitly:
  #   docker compose run --rm certbot certonly --manual --preferred-challenges dns \
  #     --manual-auth-hook /opt/acme_dns_hook.py \
  #     --manual-cleanup-hook "/opt/acme_dns_hook.py cleanup" \
  #     -d example.com -d '*.example.com'
  # See README.md "Let's Encrypt (DNS-01)" for setup.
  certbot:
    build: ./docker/certbot
    profiles: ["acme"]
    env_file: .env
    environment:
      ACME_API_BASE: http://web:8000/api
      ACME_API_USERNAME: ${ACME_API_USERNAME}
      ACME_API_PASSWORD: ${ACME_API_PASSWORD}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/log:/var/log/letsencrypt
    depends_on:
      - web
