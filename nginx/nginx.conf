events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Look "web" up through Docker's DNS when requests arrive, not only at
    # start-up: rebuilding the app gives its container a new address, and a
    # stale one made every request a 502 until nginx was restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 81;
        server_name _;

        client_max_body_size 10M;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location /static/ {
            alias /app/staticfiles/;
            expires -1;
        }

        location /branding/ {
            alias /app/branding/;
            expires 1d;
        }

        location / {
            set $django http://web:8000;
            proxy_pass $django;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
